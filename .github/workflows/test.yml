name: Automated Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      VSCODE_TEST_VERSION: '1.130.0'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile
        run: bun run compile

      - name: Run Node tests
        run: bun run test:node

      - name: Run extension-host tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a bun run test:extension

      - name: Run extension-host tests
        if: runner.os != 'Linux'
        run: bun run test:extension

      - name: Generate coverage
        if: runner.os == 'Linux'
        run: bun run test:coverage

      - name: Upload Linux coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: node-coverage-linux
          path: coverage/
